name: Feature request
description: Suggest something PxC should do.
labels: [enhancement]
body:
  - type: textarea
    id: goal
    attributes:
      label: What would you like to do?
      description: The task in your own work, not the solution.
    validations:
      required: true
  - type: textarea
    id: missing
    attributes:
      label: What is missing today?
      description: What you do now instead, and where it gets in the way.
    validations:
      required: true
  - type: input
    id: model-function
    attributes:
      label: Model and function (if it is about one)
      placeholder: e.g. Qwen Image 2.1, Fill
